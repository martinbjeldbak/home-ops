---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-drivers
  interval: 1h
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.20.5/deploy/charts/ceph-csi-drivers/values.yaml
    # Resource requests/limits carry forward the sizing previously set via
    # rook-ceph's csi*Resource keys (removed from app/helmrelease.yaml, those
    # keys are no-ops on the v1.20 chart).
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
            registrar:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            plugin:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
            provisioner:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            resizer:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            attacher:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            snapshotter:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # Chart defaults render grpcTimeout 30, replicas 1, snapshotPolicy none and
        # log rotation on; the live Driver CRs run 150/2/snapshotter-enabled/off
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
