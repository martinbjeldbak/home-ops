---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              USERMAP_UID: 1000
              USERMAP_GID: 1000
              PAPERLESS_URL: "https://{{ .Release.Name }}.martinbjeldbak.com"
              PAPERLESS_TIME_ZONE: Australia/Sydney
              PAPERLESS_OCR_LANGUAGES: dan
              PAPERLESS_OCR_LANGUAGE: dan+eng
              PAPERLESS_ENABLE_UPDATE_CHECK: "true"
              PAPERLESS_REDIS: "redis://{{ .Release.Name }}-redis:6379"
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: "{{ .Release.Name }}-db-rw"
              PAPERLESS_DBNAME: "{{ .Release.Name }}"
              PAPERLESS_DBUSER: "{{ .Release.Name }}"
              PAPERLESS_DISABLE_REGULAR_LOGIN: true
              PAPERLESS_CONSUMPTION_DIR: /library/consume
              PAPERLESS_CONSUMER_POLLING_INTERVAL: 60
              PAPERLESS_CONSUMER_STABILITY_DELAY: 30
              PAPERLESS_CONSUMER_RECURSIVE: 1
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: 1
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
              PAPERLESS_PORT: &port 8000
              PAPERLESS_FILENAME_FORMAT: "{{ `{{created_year}}/{{correspondent}}/{{created}} {{title}}` }}"
              PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: true
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://127.0.0.1:3000
              PAPERLESS_TIKA_ENDPOINT: http://127.0.0.1:9998
              PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_EMAIL_FROM: "{{ .Release.Name }}@martinbjeldbak.com"
            envFrom:
              - secretRef:
                  name: paperless-secret
            resources:
              requests:
                cpu: 100m
                memory: 1000Mi
              limits:
                memory: 5000Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 9.1.0@sha256:150c1dec38ccb51905f6bd29442706668f2442fb5d290d9eb234708dc054dd1a
            command:
              - "gotenberg"
              - "--chromium-disable-javascript=true"
              - "--chromium-allow-list=^file:///tmp/.*"
            securityContext:
              # Gotenberg's image user. Chromium's crash handler needs a writable $HOME
              # (65534 maps to /nonexistent, which breaks all HTML/email conversions).
              runAsUser: 1001
              runAsGroup: 1001
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.3.0-full
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.martinbjeldbak.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
                subPath: data
              - path: /usr/src/paperless/media
                subPath: media
      consumption:
        type: nfs
        server: alderaan.internal
        path: /volume4/paperless-inbox
        advancedMounts:
          paperless:
            app:
              - path: /library/consume
