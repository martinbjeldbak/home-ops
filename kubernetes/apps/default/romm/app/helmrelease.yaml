---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: romm
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
            env:
              TZ: Australia/Sydney
              DB_HOST: "{{ .Release.Name }}-db-rw"
              DB_PORT: 5432
              DB_NAME: "{{ .Release.Name }}"
              ROMM_DB_DRIVER: postgresql
              ROMM_PORT: &port 8080
              ENABLE_SCHEDULED_RESCAN: true
              SCHEDULED_RESCAN_CRON: "0 3 * * *"  # at 3am
              TASK_TIMEOUT: 28800  # 8h
              ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB: true
              ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC: true
              ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: true
              FLASHPOINT_API_ENABLED: true
              HLTB_API_ENABLED: true
              SCHEDULED_UPDATE_SWITCH_TITLEDB_CRON: "0 4 * * *"  # at 4am
              DISABLE_USERPASS_LOGIN: true  # require sign in with Authentik
              ROMM_SESSION_SECURE_COOKIE: true  # served over HTTPS via envoy-internal
              OIDC_ENABLED: "true"
              OIDC_AUTOLOGIN: "true"
              OIDC_PROVIDER: authentik
              OIDC_REDIRECT_URI: "https://{{ .Release.Name }}.martinbjeldbak.com/api/oauth/openid"
              OIDC_SERVER_APPLICATION_URL: "https://auth.martinbjeldbak.com/application/o/{{ .Release.Name }}"
              HASHEOUS_API_ENABLED: true
              SMTP_HOST: smtp-relay.martinbjeldbak.com  # notifications and password-reset emails
              SMTP_PORT: 25
              SMTP_SECURITY: none
              SMTP_FROM: romm@martinbjeldbak.com
              ROM_CONVERTO_ENABLED: true  # "Convert library" task and ?format= downloads
            envFrom:
              - secretRef:
                  name: romm-secret
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.martinbjeldbak.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          romm:
            app:
              - subPath: resources
                path: /romm/resources
              - subPath: assets
                path: /romm/assets
      config:
        type: configMap
        name: romm-configmap
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      library:
        type: nfs
        server: alderaan.internal
        path: /volume1/data/emulators
        globalMounts:
          - path: /romm/library
      tmpfs:
        type: emptyDir
        advancedMounts:
          romm:
            app:
              - path: /redis-data
                subPath: redis-data
              - path: /romm/config
                subPath: config
              - path: /tmp
                subPath: tmp
