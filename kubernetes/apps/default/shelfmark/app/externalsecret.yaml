---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: shelfmark-secret
    template:
      data:
        OIDC_CLIENT_ID: "{{ .SHELFMARK_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .SHELFMARK_OIDC_CLIENT_SECRET }}"
        QBITTORRENT_URL: "{{ .SHELFMARK_QUI_PROXY_URL }}"
        HARDCOVER_API_KEY: "{{ .SHELFMARK_HARDCOVER_API_KEY }}"
        PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        EMAIL_SMTP_HOST: "{{ .SMTP_RELAY_HOSTNAME }}"
  dataFrom:
    - extract:
        key: shelfmark
    - extract:
        key: prowlarr
    - extract:
        key: sabnzbd
    - extract:
        key: smtp-relay
