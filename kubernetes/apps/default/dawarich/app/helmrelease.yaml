---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dawarich
  values:
    controllers:
      dawarich:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.19.0@sha256:d9385242202ae385a5d8064f41a59a0b58218399e60e7e499d2a6afb449bc304
            command:
              - "web-entrypoint.sh"
            args:
              - "bin/rails server -p 3000 -b 0.0.0.0"
            env:
              TIME_ZONE: Australia/Sydney
              RAILS_ENV: production
              # since 1.17.0 background jobs run in-process, so there is no separate worker
              SIDEKIQ_EMBEDDED: true
              WEB_CONCURRENCY: 0
              BACKGROUND_PROCESSING_CONCURRENCY: 2
              REDIS_URL: "redis://{{ .Release.Name }}-redis:6379"
              DATABASE_HOST: "{{ .Release.Name }}-db-rw"
              DATABASE_NAME: "{{ .Release.Name }}_development"
              MIN_MINUTES_SPENT_IN_CITY: 60
              APPLICATION_HOSTS: "{{ .Release.Name }}.martinbjeldbak.com"
              APPLICATION_PROTOCOL: http
              ALLOW_EMAIL_PASSWORD_REGISTRATION: false
              ALLOW_EMAIL_PASSWORD_LOGIN: false
              SELF_HOSTED: true
              STORE_GEODATA: true
              SMTP_PORT: 25
              SMTP_DOMAIN: martinbjeldbak.com
              SMTP_FROM: "{{ .Release.Name }}@martinbjeldbak.com"
              PORT: &port 3000
              OIDC_AUTO_REGISTER: true
              OIDC_PROVIDER_NAME: "Authentik"
              OIDC_ISSUER: "https://auth.martinbjeldbak.com/application/o/{{ .Release.Name }}/"
              OIDC_REDIRECT_URI: "https://{{ .Release.Name }}.martinbjeldbak.com/users/auth/openid_connect/callback"
              PHOTON_API_HOST: photon:2322
              PHOTON_API_USE_HTTPS: false
            envFrom:
              - secretRef:
                  name: dawarich-secret
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "3Gi"
                cpu: "2000m"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.martinbjeldbak.com"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: dawarich
        globalMounts:
          - path: /var/app/public
            subPath: public
          - path: /var/app/storage
            subPath: storage
          - path: /dawarich_db_data
            subPath: dawarich_db_data
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/app/tmp
            subPath: app
      watched:
        type: emptyDir
        globalMounts:
          - path: /var/app/tmp/imports/watched
