---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photon
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: photon
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      photon:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/rtuszik/photon-docker
              tag: 2.4.0@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
            env:
              TZ: Australia/Sydney
              REGION: planet
              # SEQUENTIAL avoids the 2x disk usage PARALLEL needs during
              # index swaps; the cluster's ceph-block pool doesn't have
              # headroom for two copies of a planet-wide index.
              UPDATE_STRATEGY: SEQUENTIAL
              UPDATE_INTERVAL: 720h
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 2322
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 720
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                memory: 2.5Gi
              limits:
                memory: 10Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9011
        runAsGroup: 9011
        fsGroup: 9011
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: photon-data
        globalMounts:
          - path: /photon/data
      tmp:
        type: emptyDir
